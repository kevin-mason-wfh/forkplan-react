name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # Uncomment once added (see review): lint + tests
      # - run: npm run lint
      # - run: npm test -- --run
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
